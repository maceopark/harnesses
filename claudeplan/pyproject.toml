[project]
name = "claudeplan"
version = "0.1.0"
description = "A minimal todo CLI with a JSON store (claudeplan spec-benchmark arm)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
todo = "claudeplan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.5,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
