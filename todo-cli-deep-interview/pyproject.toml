[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli-deep-interview"
version = "0.1.0"
description = "A 4-command (add/list/done/rm) standard-library-only todo CLI."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
todo = "todo_cli:main"

[tool.setuptools]
py-modules = ["todo_cli"]
