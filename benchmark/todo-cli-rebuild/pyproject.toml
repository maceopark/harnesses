[project]
name = "todo-rebuild"
version = "0.1.0"
description = "Blind-rebuild arm of the todo CLI variation experiment (spec: .ultimateinterview/todo-cli-app-2/handoff.md)"
requires-python = ">=3.12"

[project.scripts]
todo = "todo_rebuild:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["todo_rebuild"]

[dependency-groups]
dev = ["pytest>=8"]
