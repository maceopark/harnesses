[project]
name = "todo-cli-ultimateinterview"
version = "0.1.0"
description = "Strict local todo CLI benchmark fixture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
todo = "todo_cli:main"

[project.entry-points.pytest11]
todo_cli_ultimateinterview = "todo_cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["todo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
