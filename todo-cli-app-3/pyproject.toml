[project]
name = "todo-cli-app-3"
version = "0.1.0"
description = "Morning todo CLI: type `todo` on arriving at work and see today's tasks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
todo = "todo_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
