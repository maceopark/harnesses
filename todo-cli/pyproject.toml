[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "A deliberately minimal personal todo CLI: add / list / done, one JSON file."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
todo = "todo_cli:main"

[tool.setuptools]
py-modules = ["todo_cli"]

[dependency-groups]
dev = ["pytest>=8.0"]
