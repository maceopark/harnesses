[project]
name = "todo-cli-app-4"
version = "0.1.0"
description = "Single-user CLI todo app"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
todo = "todo_cli.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_cli"]
