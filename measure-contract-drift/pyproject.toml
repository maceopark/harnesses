[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimateinterview-contract-drift"
version = "0.1.0"
description = "Minimal-seed structured interview discovery experiment"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7",
]
[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
driftbench = "driftbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
