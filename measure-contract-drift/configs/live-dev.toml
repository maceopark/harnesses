# RunConfig.v1 forbids undeclared keys. These comments are binding deployment
# requirements, enforced by the live admission controller rather than this portable file:
# - provider.invoke.v1
# - simulator.execute.v1
# - evaluator.score.v1
# No credentials, provider endpoint, private corpus reference, holdout partition, or
# ultimateinterview-full-v2-expected-fail arm belongs in this public configuration.
# The standalone controller deliberately rejects live mode until those services attest
# the required capabilities.
schema = "RunConfig.v1"
mode = "live-dev"
release_id = "contract-drift-dev-v2"
corpus_root = "corpus/public"
seed_label = "live-dev-v1"
partition = "dev"
max_attempts = 1

[models]
planner = "live-planner"
implementer = "live-implementer"
postmortem = "live-postmortem"

[[arms]]
arm_id = "direct-v1"
source = "scored"

[[arms]]
arm_id = "plan-v1"
source = "scored"

[[arms]]
arm_id = "ultimateinterview-current-v1-structural"
source = "scored"
